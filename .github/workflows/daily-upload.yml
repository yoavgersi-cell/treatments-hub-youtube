name: Daily YouTube Short

on:
  schedule:
    - cron: "17 15 * * *"   # 15:17 UTC daily (10:17 ET)
  workflow_dispatch:
    inputs:
      preview:
        description: "Queue folder to PREVIEW (build only, no upload). Leave empty to publish the next due Short."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-upload
  cancel-in-progress: false

jobs:
  publish:
    # Pinned: ubuntu-latest moved to 26.04 (Nov 2026) and Playwright 1.56 has no Chromium build for it yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (site captures)
        run: npm i --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Build (and upload) the Short
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ -n "$PREVIEW" ]; then python scripts/publish_next.py --preview "$PREVIEW"; else python scripts/publish_next.py; fi
      - name: Keep the preview video for download
        if: ${{ inputs.preview != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.preview }}
          path: queue/${{ inputs.preview }}/video.mp4
          if-no-files-found: ignore
          retention-days: 14
      # Runs even after a failure so heygen.json (the render id) is kept and a
      # retry downloads the finished render instead of paying for a new one.
      - name: Record state
        if: always()
        run: |
          git config user.name "treatments-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue
          [ -d published ] && git add -A published || true
          git diff --cached --quiet || (git commit -m "Shorts state $(date -u +%F)" && git pull --rebase -q && git push)
