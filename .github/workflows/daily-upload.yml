name: Daily YouTube Short

on:
  schedule:
    - cron: "17 15 * * *"   # 15:17 UTC daily (10:17 ET)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-upload
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: Build and upload the next Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
        run: python scripts/publish_next.py
      - name: Record what was published
        run: |
          git config user.name "treatments-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published
          git diff --cached --quiet || (git commit -m "Published $(date -u +%F) Short" && git push)
